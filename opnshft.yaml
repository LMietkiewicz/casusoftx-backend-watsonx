# ===========================================================================================
# OpenShift manifests — casusoftx-backend
#
# SECRETS: sensitive values (API_KEY, PROJECT_ID, CSX_PASSWORD, POSTGRES_PASSWORD) are stored
# ENCRYPTED as ENC(...) tokens, produced with `python cipher.py encrypt`.
# Because they are ciphertext they live in the ConfigMap, not the Secret.
# The ONLY real secret is CONFIG_PASSPHRASE, which decrypts them at startup.
#
# Apply order: ConfigMap -> Secret -> Deployment -> Service -> Route
# Console: use the "+" icon (top right) -> Import YAML -> paste this whole file
# CLI:     oc apply -f openshift-manifests.yaml
# ===========================================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: casusoftx-backend-config
data:
  # --- inference backend ---
  PROVIDER: "watsonx"                              # ollama | watsonx
  INFERENCE_PROVIDER_BASE_URL: "https://eu-de.ml.cloud.ibm.com"        # watsonx endpoint, e.g.
                                                  # https://us-south.ml.cloud.ibm.com
                                                  # (ollama: a URL reachable from the
                                                  # pod — localhost:11434 does NOT
                                                  # exist inside it)

  # --- watsonx credentials (ENCRYPTED) ---
  # Generate each with:  CONFIG_PASSPHRASE=... python cipher.py encrypt
  API_KEY: "ENC(B7mYazS1tfvMBNlaWISMw5zEjARoEqXx0bF/VZeYK5ovgoL20Io5QkDuKC60MciMNU9xod3S5Eefir4xBedSAbXpHz9LbJPnRiUKEPP15xDjkKnM9L0qFQ==)"
  PROJECT_ID: "ENC(x/mBBXfbowN5pP/BLFDGGli7XtGZbNZosc2ihsfPQjabEBnpgi0Zy6m7qcY2cnEuV+/eKTVpN2/gKLqJxITBGlIHYRkJFQhMIEuQQRIDZDg=)"

  # --- CasuSoft X storage (s3-gateway) ---
  CSX_BASE_URL: "CHANGE_ME"                        
  CSX_USERNAME: "casusoftxproxy"                  
  CSX_PASSWORD: "CHANGE_ME"                   

  # --- infrastructure ---
  # unoserver sidecar: same pod, same network namespace.
  UNOSERVER_HOST: "127.0.0.1"
  UNOSERVER_PORT: "2003"
  UNOSERVER_TIMEOUT: "120"

  # Postgres/pgvector is external. 
  POSTGRES_HOST: "CHANGE_ME"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "casusoftx"
  POSTGRES_USER: "casusoftx"
  POSTGRES_PASSWORD: "ENC(CHANGE_ME)"
  POSTGRES_TABLE: "chunks"

  PORT: "5000"

  # --- keep these off ---
  DEBUG: "false"
  ACKNOWLEDGE_SENSITIVE_LOGGING: "false"
  LOG_LEVEL: "INFO"

---
apiVersion: v1
kind: Secret
metadata:
  name: casusoftx-backend-secrets
type: Opaque
stringData:
  CONFIG_PASSPHRASE: "23gf2hvf273yfvjhvyifg23fyr4fiyfncnn33y3"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casusoftx-backend
  labels:
    app: casusoftx-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: casusoftx-backend
  template:
    metadata:
      labels:
        app: casusoftx-backend
    spec:
      containers:
        - name: casusoftx-backend
          image: quay.io/lukasz_mietkiewicz/csx-backend-s390x:main
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: casusoftx-backend-config
            - secretRef:
                name: casusoftx-backend-secrets
                optional: true    

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP


          resources:
            requests:
              memory: "7Gi"
              cpu: "1"
            limits:
              memory: "9Gi"
              cpu: "2"

          # Model load from the baked-in cache takes 30-90s. Without a
          # startupProbe the livenessProbe kills the pod mid-warmup and you
          # get a restart loop with no useful error.
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30   # allows up to ~5 min to come up
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 5

        # --- LibreOffice converter sidecar --------------------------------
        # Replaces Gotenberg. Exists as a separate container because the app's
        # base image is RHEL 10, which no longer packages LibreOffice, and
        # Gotenberg publishes no s390x image.
        #
        # unoserver keeps ONE LibreOffice process resident and exposes it over
        # XML-RPC. That avoids both the ~1.2s per-conversion startup and the
        # profile-lock contention that makes concurrent 'soffice' invocations
        # fail silently (measured: 2 of 4 parallel jobs failed, no useful error).
        #
        # Built from converter.Dockerfile — there is no upstream image for this.
        - name: converter
          image: quay.io/lukasz_mietkiewicz/csx-converter:main
          imagePullPolicy: Always

          # LibreOffice writes its user profile under HOME. The arbitrary
          # OpenShift UID has no /etc/passwd entry, so HOME must be set to
          # something writable or the profile creation fails.
          env:
            - name: HOME
              value: /tmp

          ports:
            - name: unoserver
              containerPort: 2003
              protocol: TCP

          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1"

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          # tcpSocket, NOT httpGet: unoserver speaks XML-RPC and returns
          # HTTP 501 to any GET, which Kubernetes counts as a failure. An
          # httpGet probe here would restart-loop the container forever.
          startupProbe:
            tcpSocket:
              port: 2003
            periodSeconds: 5
            failureThreshold: 12   # ~60s; measured cold start is 8-12s

          livenessProbe:
            tcpSocket:
              port: 2003
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        # LibreOffice writes its user profile under HOME (=/tmp). The container
        # filesystem is read-only to the arbitrary UID, so this must be a real
        # writable volume, not just an env var.
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: casusoftx-backend
  labels:
    app: casusoftx-backend
spec:
  selector:
    app: casusoftx-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: casusoftx-backend
  labels:
    app: casusoftx-backend
  annotations:
    haproxy.router.openshift.io/timeout: 120s
spec:
  to:
    kind: Service
    name: casusoftx-backend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
