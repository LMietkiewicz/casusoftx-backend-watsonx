# =============================================================================
# OpenShift manifests — casusoftx-backend
#
# SECRETS: sensitive values (API_KEY, PROJECT_ID, CSX_PASSWORD) are stored
# ENCRYPTED as ENC(...) tokens, produced with `python cipher.py encrypt`.
# Because they are ciphertext they live in the ConfigMap, not the Secret.
# The ONLY real secret is CONFIG_PASSPHRASE, which decrypts them at startup.
#
# Apply order: ConfigMap -> Secret -> Deployment -> Service -> Route
# Console: use the "+" icon (top right) -> Import YAML -> paste this whole file
# CLI:     oc apply -f openshift-manifests.yaml
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: casusoftx-backend-config
data:
  # --- inference backend ---
  PROVIDER: "watsonx"                              # ollama | watsonx
  INFERENCE_PROVIDER_BASE_URL: "CHANGE_ME"        # watsonx endpoint, e.g.
                                                  # https://us-south.ml.cloud.ibm.com
                                                  # (ollama: a URL reachable from the
                                                  # pod — localhost:11434 does NOT
                                                  # exist inside it)

  # --- watsonx credentials (ENCRYPTED) ---
  # Generate each with:  CONFIG_PASSPHRASE=... python cipher.py encrypt
  API_KEY: "ENC(CHANGE_ME)"
  PROJECT_ID: "ENC(CHANGE_ME)"

  # --- CasuSoft X storage (s3-gateway) ---
  CSX_BASE_URL: "CHANGE_ME"                        
  CSX_USERNAME: "casusoftxproxy"                  
  CSX_PASSWORD: "ENC(CHANGE_ME)"                   

  # --- infrastructure ---
  # Gotenberg is a sidecar: same pod, same network namespace.
  # http://gotenberg:3000.
  GOTENBERG_URL: "http://localhost:3000"

  # Milvus is external. 
  MILVUS_HOST: "CHANGE_ME"
  MILVUS_PORT: "19530"
  MILVUS_COLLECTION: "file_embeddings"

  PORT: "5000"

  # --- keep these off ---
  DEBUG: "false"
  ACKNOWLEDGE_SENSITIVE_LOGGING: "false"
  LOG_LEVEL: "INFO"

---
apiVersion: v1
kind: Secret
metadata:
  name: casusoftx-backend-secrets
type: Opaque
stringData:
  CONFIG_PASSPHRASE: "CHANGE_ME"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casusoftx-backend
  labels:
    app: casusoftx-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: casusoftx-backend
  template:
    metadata:
      labels:
        app: casusoftx-backend
    spec:
      containers:
        - name: casusoftx-backend
          image: quay.io/lukasz_mietkiewicz/csx-backend-tests:main
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: casusoftx-backend-config
            - secretRef:
                name: casusoftx-backend-secrets
                optional: true    

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP


          resources:
            requests:
              memory: "7Gi"
              cpu: "1"
            limits:
              memory: "9Gi"
              cpu: "2"

          # Model load from the baked-in cache takes 30-90s. Without a
          # startupProbe the livenessProbe kills the pod mid-warmup and you
          # get a restart loop with no useful error.
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30   # allows up to ~5 min to come up
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 5

        # --- Gotenberg sidecar ------------------------------------------
        # Stateless, 1:1 with the app, no persistence — a legitimate sidecar.
        # Shares the pod's network namespace, so the app reaches it at
        # localhost:3000.
        #
        # Pinned by digest to prevent drift: the :8 tag floats to the latest
        # 8.x.y at pull time, so two nodes could run different builds. Get the
        # digest with:
        #   docker pull gotenberg/gotenberg:8
        #   docker inspect --format='{{index .RepoDigests 0}}' gotenberg/gotenberg:8
        # Keep the :8 in front — it documents the version the digest is.
        - name: gotenberg
          image: gotenberg/gotenberg:8@sha256:CHANGE_ME
          imagePullPolicy: IfNotPresent

          env:
            - name: XDG_CONFIG_HOME
              value: /tmp/xdg-config
            - name: XDG_CACHE_HOME
              value: /tmp/xdg-cache
            - name: XDG_DATA_HOME
              value: /tmp/xdg-data
            - name: HOME
              value: /tmp

          ports:
            - name: gotenberg
              containerPort: 3000
              protocol: TCP

          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1"

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30

      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: casusoftx-backend
  labels:
    app: casusoftx-backend
spec:
  selector:
    app: casusoftx-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: casusoftx-backend
  labels:
    app: casusoftx-backend
  annotations:
    haproxy.router.openshift.io/timeout: 120s
spec:
  to:
    kind: Service
    name: casusoftx-backend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
